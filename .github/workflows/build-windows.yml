name: Build Windows Setup

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 75
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64, with tests)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DTF_BUILD_TESTS=ON

      - name: Build app and engine test (Release)
        run: cmake --build build --config Release --parallel

      - name: Download FFmpeg 8.0 (pinned, SHA-256 verified)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force deps, bundle\models | Out-Null
          & curl.exe -sSfL --retry 3 --connect-timeout 30 --max-time 400 -o deps\ff.zip "https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-essentials_build.zip"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          $h = (Get-FileHash deps\ff.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "647e467caf82b9fa200a562769b5ff4d736aaf725804ed2c64ea9752106fa569") { throw "Checksum mismatch ($h)" }

      - name: Download AI engine sherpa-onnx 2.0.1 (pinned, SHA-256 verified)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & curl.exe -sSfL --retry 3 --connect-timeout 30 --max-time 400 -o deps\so.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-win-x64-shared-MT-Release.tar.bz2"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          $h = (Get-FileHash deps\so.tar.bz2 -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "dc703575a68594435f53dec93df775ff4913af851a196c0537163f21d8d2364e") { throw "Checksum mismatch ($h)" }

      - name: Download AI separation model (pinned, SHA-256 verified)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & curl.exe -sSfL --retry 3 --connect-timeout 30 --max-time 400 -o bundle\models\UVR-MDX-NET-Inst_HQ_3.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR-MDX-NET-Inst_HQ_3.onnx"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          $h = (Get-FileHash bundle\models\UVR-MDX-NET-Inst_HQ_3.onnx -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "c207b845d51dc1303c543503f6f5a8b596da5d7de97bead77b3e16ec38e8d5b3") { throw "Checksum mismatch ($h)" }

      - name: Unpack bundled tools
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & 7z x -y -odeps\ff deps\ff.zip "ffmpeg-8.0-essentials_build/bin/ffmpeg.exe" "ffmpeg-8.0-essentials_build/LICENSE" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unzip failed" }
          & 7z x -y -odeps deps\so.tar.bz2 | Out-Null
          & 7z x -y -odeps deps\so.tar "sherpa-onnx-v2.0.1-win-x64-shared-MT-Release/lib/*.dll" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Untar failed" }
          Copy-Item deps\ff\ffmpeg-8.0-essentials_build\bin\ffmpeg.exe bundle\
          Copy-Item deps\ff\ffmpeg-8.0-essentials_build\LICENSE bundle\FFMPEG-LICENSE.txt
          $so = "deps\sherpa-onnx-v2.0.1-win-x64-shared-MT-Release\lib"
          Copy-Item "$so\sherpa-onnx-c-api.dll", "$so\onnxruntime.dll", "$so\onnxruntime_providers_shared.dll" bundle\
          Get-ChildItem -Recurse bundle | Format-Table Name, Length

      - name: Run engine test (sync, effects, auto-tune, video, AI separation, CPU load)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $t = "build\TFEngineTest_artefacts\Release"
          Copy-Item -Recurse -Force bundle\* $t\
          & "$t\TFEngineTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Engine test failed" }

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        timeout-minutes: 10
        run: choco install innosetup --no-progress -y

      - name: Make Setup.exe
        shell: pwsh
        run: |
          $exe = Resolve-Path "build\TFVocalStudio_artefacts\Release\TF Vocal Studio.exe"
          $bundle = Resolve-Path "bundle"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=$exe" "/DBundleDir=$bundle" installer\TFVocalStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-FileHash installer\Output\*.exe -Algorithm SHA256 | Format-List

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: TF-Vocal-Studio-Setup
          path: installer/Output/*.exe
          if-no-files-found: error

  release:
    # every successful build of main (or a v* tag) becomes a downloadable release
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TF-Vocal-Studio-Setup
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TF Vocal Studio ${{ needs.build.outputs.version }}
          make_latest: true
          body: |
            TF Vocal Studio — Windows 10/11 (64-bit)

            ডাউনলোড করুন: নিচের **TF-Vocal-Studio-Setup-….exe** ফাইলে ক্লিক করুন, তারপর ডাবল-ক্লিক করে ইনস্টল করুন।
